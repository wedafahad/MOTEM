<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متم — تقييم الكتّاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* هوية كناية 2026 — Ink Black / Warm Paper / Soft Mist + Accents */
    --ink-900:#111111;
    --ink-700:#585858;
    --ink-500:#8A8A8A;
    --paper:#F2EEEC;
    --paper-dim:#EBE6E3;
    --card:#FCFBFA;
    --brand:#7E969D;
    --brand-dark:#5F7176;
    --brass:#EFA14C;
    --brass-soft:#F8D5AE;
    --brick:#C4766A;
    --brick-soft:#F2DBD7;
    --lilac:#C9BFF2;
    --lilac-soft:#E7E2F9;
    --sage:#DDF1D7;
    --line:#D8D2CF;
    --line-strong:#C2BDBB;
    --shadow: 0 1px 2px rgba(17,17,17,.06), 0 6px 20px rgba(17,17,17,.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-900);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--brass-soft); }
  .num{ font-family:'Cairo', sans-serif; font-feature-settings:"tnum"; font-weight:600; direction:ltr; display:inline-block; }
  h1,h2,h3,.display{ font-family:'Cairo', sans-serif; font-weight:800; letter-spacing:0; }

  /* ---------- App shell ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px; flex:0 0 230px;
    background:var(--ink-900);
    color:#F1EEEC;
    padding:22px 16px;
    display:flex; flex-direction:column; gap:6px;
  }
  .brand-mark{
    display:flex; flex-direction:column; align-items:flex-start; gap:12px; margin-bottom:22px; padding:0 6px;
  }
  .brand-mark img.brand-logo{ width:104px; height:auto; display:block; }
  .brand-title-row{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark .dot{ width:10px;height:10px;border-radius:2px; background:var(--brass); transform:rotate(45deg); flex:0 0 auto; }
  .brand-mark .title{ font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; }
  .brand-mark .sub{ font-size:11px; color:#A79E9A; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    color:#D8D2CF; font-size:14.5px; font-weight:500;
    border:1px solid transparent;
    transition:background .15s ease;
  }
  .nav-item:hover{ background:rgba(255,255,255,.06); }
  .nav-item.active{ background:var(--brand); color:#fff; }
  .nav-item .ic{ width:18px; text-align:center; opacity:.9; font-size:15px; }
  .nav-sep{ height:1px; background:rgba(255,255,255,.1); margin:12px 4px; }
  .nav-label{ font-size:11px; color:#948B87; padding:6px 12px 2px; letter-spacing:.5px; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:16px 26px; border-bottom:1px solid var(--line);
    background:var(--paper); position:sticky; top:0; z-index:5;
  }
  .topbar .grow{ flex:1; }
  .topbar h2{ margin:0; font-size:20px; }
  .topbar .desc{ font-size:12.5px; color:var(--ink-500); margin-top:2px; font-family:'Cairo'; }

  select, input, textarea, button{ font-family:inherit; }
  select, input[type=text], input[type=number], input[type=date], textarea{
    background:var(--card); border:1px solid var(--line-strong); border-radius:9px;
    padding:8px 10px; font-size:13.5px; color:var(--ink-900);
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--ink-700); font-weight:600; }

  .pill-toggle{ display:flex; background:var(--card); border:1px solid var(--line-strong); border-radius:999px; padding:3px; gap:2px; }
  .pill-toggle button{ border:0; background:transparent; padding:6px 14px; border-radius:999px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-500); }
  .pill-toggle button.active{ background:var(--ink-900); color:#fff; }

  .btn{ border:0; border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-brand{ background:var(--brand); color:#fff; }
  .btn-brand:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:transparent; color:var(--ink-700); border:1px solid var(--line-strong); }
  .btn-ghost:hover{ background:var(--paper-dim); }
  .btn-brass{ background:var(--brass); color:#3A2A05; }
  .btn-danger{ background:var(--brick-soft); color:var(--brick); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }

  .content{ padding:24px 26px 60px; max-width:1180px; width:100%; margin:0 auto; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:18px; }
  .card h3{ margin:0 0 4px; font-size:16px; }
  .card .hint{ font-size:12.5px; color:var(--ink-500); margin-bottom:14px; }

  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:820px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } .sidebar{ display:none; } }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:right; font-size:11.5px; color:var(--ink-500); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line-strong); }
  td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }
  tr:hover td{ background:rgba(31,111,92,.035); }

  .tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; }
  .tag-brand{ background:#E2F3F7; color:var(--brand-dark); }
  .tag-brass{ background:var(--brass-soft); color:#7A560E; }
  .tag-brick{ background:var(--brick-soft); color:var(--brick); }
  .tag-mute{ background:var(--paper-dim); color:var(--ink-500); }

  /* Ledger tally — signature element */
  .ledger{
    display:flex; align-items:stretch; gap:0; border:1px solid var(--line-strong); border-radius:12px; overflow:hidden;
    background:linear-gradient(180deg, var(--card), var(--paper-dim));
  }
  .ledger .rail{ width:6px; background:repeating-linear-gradient(180deg, var(--brass) 0 3px, transparent 3px 9px); }
  .ledger .body{ flex:1; padding:18px 22px; }
  .ledger .figure{ font-family:'Cairo',sans-serif; font-size:44px; font-weight:800; direction:ltr; display:flex; align-items:baseline; gap:10px; }
  .ledger .figure small{ font-size:15px; color:var(--ink-500); font-family:'Cairo'; font-weight:400; }
  .ledger .rows{ margin-top:12px; display:flex; gap:22px; flex-wrap:wrap; }
  .ledger .rows div{ font-size:12px; color:var(--ink-500); }
  .ledger .rows b{ display:block; font-family:'Cairo',sans-serif; font-weight:700; font-size:16px; color:var(--ink-900); }

  .kpi{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--card); }
  .kpi .lbl{ font-size:11.5px; color:var(--ink-500); font-weight:600; }
  .kpi .val{ font-family:'Cairo',sans-serif; font-weight:700; font-size:24px; margin-top:4px; }
  .kpi .sub{ font-size:11.5px; color:var(--ink-500); margin-top:2px; }

  .bar-bg{ height:7px; border-radius:999px; background:var(--paper-dim); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background:var(--brand); }

  .empty{ text-align:center; padding:36px 20px; color:var(--ink-500); }
  .empty .ic{ font-size:26px; margin-bottom:8px; }

  .modal-bg{ position:fixed; inset:0; background:rgba(21,39,34,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:560px; max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal h3{ margin-top:0; }
  .row-flex{ display:flex; gap:10px; align-items:center; }
  .close-x{ cursor:pointer; color:var(--ink-500); font-size:18px; background:none; border:0; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink-900); color:#fff; padding:11px 20px; border-radius:10px; font-size:13px; z-index:100; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .footnote{ font-size:11.5px; color:var(--ink-500); border-top:1px dashed var(--line-strong); margin-top:10px; padding-top:10px; }
  .collab-row{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .collab-row input{ flex:1; }

  .rate-chips{ display:inline-flex; gap:4px; }
  .rate-chip{ width:26px; height:26px; border-radius:7px; border:1px solid var(--line-strong); background:var(--card); font-family:'Cairo',sans-serif; font-weight:600; font-size:12px; cursor:pointer; color:var(--ink-700); }
  .rate-chip:hover{ border-color:var(--brand); }
  .rate-chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .rate-chip.locked{ cursor:default; opacity:.55; }
  .rate-chip.on.locked{ background:var(--ink-500); border-color:var(--ink-500); }
  .section-total{ display:flex; justify-content:space-between; align-items:center; background:var(--paper-dim); border-radius:10px; padding:10px 14px; margin-top:10px; font-size:13px; font-weight:700; }
  .weight-badge{ font-family:'Cairo',sans-serif; font-size:11px; color:var(--ink-500); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   متم — تطبيق تقييم الكتّاب (بيانات مشتركة عبر window.storage)
   منهجية التقييم: تقييم ذاتي + تقييم مدير مباشر (1-5) لكل مؤشر
   بنفس عناصر ملف "نموذج تقييم كاتب أول" الفعلي، عدا المؤشرات المدمجة/المعاد تصميمها
   ========================================================= */
const CATS = ['كتابة','مراجعة','ترجمة'];
const CAT_LABEL = {كتابة:'كتابة', مراجعة:'مراجعة وتدقيق', ترجمة:'ترجمة'};

const seedWorktypes = [
 {id:'wt1', name:'عرض تقديمي', rules:{كتابة:{mode:'fixed',value:10}, مراجعة:{mode:'fixed',value:2}, ترجمة:{mode:'fixed',value:5}}},
 {id:'wt2', name:'الإنفوجرافيك', rules:{كتابة:{mode:'ratio',value:10}, مراجعة:{mode:'ratio',value:20}, ترجمة:{mode:'ratio',value:10}}},
 {id:'wt3', name:'البطاقات الرقمية + Gif', rules:{كتابة:{mode:'ratio',value:10}, مراجعة:{mode:'ratio',value:20}, ترجمة:{mode:'ratio',value:10}}},
 {id:'wt4', name:'التقرير السنوي', rules:{كتابة:{mode:'fixed',value:100}, مراجعة:{mode:'fixed',value:30}, ترجمة:{mode:'fixed',value:50}}},
 {id:'wt5', name:'الحملات الإعلانية', rules:{كتابة:{mode:'fixed',value:10}, مراجعة:{mode:'fixed',value:5}, ترجمة:{mode:'fixed',value:5}}},
 {id:'wt6', name:'السيرة الذاتية', rules:{كتابة:{mode:'fixed',value:5}, مراجعة:{mode:'fixed',value:1}, ترجمة:{mode:'fixed',value:1}}},
 {id:'wt7', name:'تقرير مشروع / متخصص', rules:{كتابة:{mode:'fixed',value:25}, مراجعة:{mode:'fixed',value:10}, ترجمة:{mode:'fixed',value:10}}},
 {id:'wt8', name:'صفحة الهبوط', rules:{كتابة:{mode:'fixed',value:10}, مراجعة:{mode:'fixed',value:2}, ترجمة:{mode:'fixed',value:5}}},
 {id:'wt9', name:'التغريدات', rules:{كتابة:{mode:'ratio',value:10}, مراجعة:{mode:'ratio',value:20}, ترجمة:{mode:'ratio',value:10}}},
 {id:'wt10', name:'ملفات PDF التفاعلية', rules:{كتابة:{mode:'fixed',value:10}, مراجعة:{mode:'fixed',value:2}, ترجمة:{mode:'fixed',value:5}}},
 {id:'wt11', name:'نص إعلاني', rules:{كتابة:{mode:'ratio',value:5}, مراجعة:{mode:'ratio',value:15}}},
 {id:'wt12', name:'وصف اليوتيوب', rules:{كتابة:{mode:'ratio',value:10}, مراجعة:{mode:'ratio',value:20}}},
 {id:'wt13', name:'اسم تجاري', rules:{كتابة:{mode:'ratio',value:5}}},
 {id:'wt14', name:'الأسئلة الشائعة مع أجوبة', rules:{كتابة:{mode:'ratio',value:5}, مراجعة:{mode:'ratio',value:10}}},
 {id:'wt15', name:'الملف التعريفي', rules:{كتابة:{mode:'fixed',value:10}, مراجعة:{mode:'fixed',value:2}, ترجمة:{mode:'fixed',value:5}}},
 {id:'wt16', name:'وصف منتج', rules:{كتابة:{mode:'ratio',value:10}, مراجعة:{mode:'ratio',value:20}}},
 {id:'wt17', name:'الشعار اللفظي (Slogan)', rules:{كتابة:{mode:'fixed',value:1}, مراجعة:{mode:'ratio',value:3}}},
 {id:'wt18', name:'الموشن جرافيك', rules:{كتابة:{mode:'fixed',value:1}, مراجعة:{mode:'ratio',value:3}}},
 {id:'wt19', name:'محتوى الموقع الإلكتروني', rules:{كتابة:{mode:'fixed',value:10}, مراجعة:{mode:'fixed',value:2}}},
 {id:'wt20', name:'خطة محتوى مواقع التواصل', rules:{كتابة:{mode:'fixed',value:6}, مراجعة:{mode:'fixed',value:2}}},
 {id:'wt21', name:'كتابة المقالة (المدونات)', rules:{كتابة:{mode:'ratio_words',value:300}, مراجعة:{mode:'ratio_words',value:600}}},
 {id:'wt22', name:'النشرة البريدية', rules:{كتابة:{mode:'fixed',value:5}, مراجعة:{mode:'fixed',value:2}, ترجمة:{mode:'fixed',value:2}}},
 {id:'wt23', name:'منشورات كاروسيل', rules:{كتابة:{mode:'ratio',value:1}}},
];

const ROLES = ['كاتب','كاتب أول','مدير الكتّاب','مدير عام'];
const WRITER_ROLES = ['كاتب','كاتب أول']; // الأدوار اللي تنتج نصوصاً وتُسجّل أعمالاً في سجل الأعمال
// ملاحظة: صلاحية التقييم (isEvaluator) منفصلة عن الدور الوظيفي — عشان يقدر شخص يكون "كاتب أول" ومقيّماً في نفس الوقت (مثل وداد)

const seedEmployees = [
  {id:'mgr_general', name:'صالح السيف', role:'مدير عام', evaluatorId:null, isEvaluator:true, evaluatorCode:'9999'},
  {id:'e1', name:'وداد الدريني', role:'كاتب أول', evaluatorId:'mgr_general', isEvaluator:true, evaluatorCode:'5555', code:'5551'},
  {id:'e2', name:'مبارك الدوسري', role:'كاتب أول', evaluatorId:'e1', code:'1111'},
  {id:'e3', name:'ميمونة المرشد', role:'كاتب', evaluatorId:'e1', code:'2222'},
  {id:'e4', name:'حمزة السويلم', role:'كاتب', evaluatorId:'e1', code:'3333'},
  {id:'e5', name:'أفنان الأسمري', role:'كاتب', evaluatorId:'e1', code:'4444'},
  {id:'e6', name:'سارة القحطاني', role:'كاتب', evaluatorId:'e1', code:'6666'},
];

const seedSecurity = { adminPassword:'2580' };
const DEFAULT_REVISION_FACTOR = 0.3;

// الحد الأدنى المستهدف لكل مؤشر أداء وظيفي حسب الدور — قيمة افتراضية أولى، يُعاد احتسابها/تعديلها كل ربع
const seedMins = {
  'كاتب':      { kpi_نصوص:500, kpi_مشاريع:8,  kpi_حملات:1, kpi_دورات:1, kpi_مبادرات:2, kpi_تطوير_ذاتي:1, kpi_أنواع_نصوص:4, kpi_ورشة_تطوير:1, kpi_جلب_مشاريع:1 },
  'كاتب أول':  { kpi_نصوص:300, kpi_مشاريع:10, kpi_قيادة_فريق:6, kpi_دورات:1, kpi_تطوير_ذاتي:1, kpi_مبادرات:3, kpi_أنواع_نصوص:5, kpi_ورشة_تطوير:2, kpi_ملازمة_كاتب:2 },
  'مدير الكتّاب': { kpi_نصوص:150, kpi_مشاريع:10, kpi_قيادة_فريق:10, kpi_دورات:1, kpi_تطوير_ذاتي:1, kpi_مبادرات:4, kpi_أنواع_نصوص:5, kpi_ورشة_تطوير:3, kpi_ملازمة_كاتب:3 },
};
function minsForRole(role){ return seedMins[role] || seedMins['كاتب']; }

// عناصر "الأداء الوظيفي" — مختلفة لكل دور وفق نموذج التقييم الفعلي المعتمد لكل مسمى وظيفي.
// قابلة للقياس، تُحتسب بالنسبة (المحقق÷الحد الأدنى). auto:'text'/'types' = تُحسب تلقائياً من سجل الأعمال، والباقي رقم يُدخله الكاتب ويصححه المدير.
const KPI_INDICATORS_BY_ROLE = {
 'كاتب': [
  {key:'kpi_نصوص', label:'عدد النصوص', weight:0.25, unit:'نص', auto:'text'},
  {key:'kpi_مشاريع', label:'عدد المشاريع', weight:0.15, unit:'مشروع'},
  {key:'kpi_حملات', label:'عدد الحملات التسويقية لكناية', weight:0.10, unit:'حملة'},
  {key:'kpi_دورات', label:'عدد الدورات اللغوية', weight:0.15, unit:'دورة'},
  {key:'kpi_مبادرات', label:'المبادرات', weight:0.10, unit:'مبادرة'},
  {key:'kpi_تطوير_ذاتي', label:'التطوير الذاتي', weight:0.10, unit:'نشاط'},
  {key:'kpi_أنواع_نصوص', label:'عدد أنواع النصوص', weight:0.05, unit:'نوع', auto:'types'},
  {key:'kpi_ورشة_تطوير', label:'ورشة تطوير', weight:0.05, unit:'ورشة'},
  {key:'kpi_جلب_مشاريع', label:'جلب مشاريع', weight:0.05, unit:'مشروع'},
 ],
 'كاتب أول': [
  {key:'kpi_نصوص', label:'عدد النصوص', weight:0.10, unit:'نص', auto:'text'},
  {key:'kpi_مشاريع', label:'عدد المشاريع', weight:0.10, unit:'مشروع'},
  {key:'kpi_قيادة_فريق', label:'قيادة فريق الكتابة', weight:0.10, unit:'مرة'},
  {key:'kpi_دورات', label:'عدد الدورات اللغوية', weight:0.10, unit:'دورة'},
  {key:'kpi_مبادرات', label:'المبادرات', weight:0.10, unit:'مبادرة'},
  {key:'kpi_تطوير_ذاتي', label:'التطوير الذاتي', weight:0.05, unit:'نشاط'},
  {key:'kpi_أنواع_نصوص', label:'عدد أنواع النصوص', weight:0.05, unit:'نوع', auto:'types'},
  {key:'kpi_ورشة_تطوير', label:'ورشة تطوير فريق الكتابة', weight:0.05, unit:'ورشة'},
  {key:'kpi_ملازمة_كاتب', label:'ملازمة كاتب', weight:0.05, unit:'جلسة'},
 ],
};
KPI_INDICATORS_BY_ROLE['مدير الكتّاب'] = KPI_INDICATORS_BY_ROLE['كاتب أول']; // مؤقتاً بانتظار مؤشرات مخصّصة لهذا الدور
function kpiIndicatorsForRole(role){ return KPI_INDICATORS_BY_ROLE[role] || KPI_INDICATORS_BY_ROLE['كاتب']; }
function kpiUnionList(){
  const seen = new Map();
  Object.values(KPI_INDICATORS_BY_ROLE).forEach(list=>list.forEach(i=>{ if(!seen.has(i.key)) seen.set(i.key, i); }));
  return Array.from(seen.values());
}
// عناصر "الكفاءة السلوكية" — مشتركة بين كل الأدوار، كما هي في ملف التقييم الجديد
const BEHAVIORAL_INDICATORS = [
 {key:'beh_تقديم_مخرجات', label:'تقديم المخرجات', weight:0.10},
 {key:'beh_عمل_تحت_ضغط', label:'العمل تحت الضغط', weight:0.10},
 {key:'beh_تكيف', label:'التكيف', weight:0.10},
 {key:'beh_التزام_حضور', label:'الالتزام بالحضور', weight:0.10},
 {key:'beh_مبادرات', label:'المبادرات', weight:0.10},
 {key:'beh_انتباه_تفاصيل', label:'الانتباه للتفاصيل', weight:0.10},
 {key:'beh_تواصل_فعال', label:'التواصل الفعال', weight:0.10},
 {key:'beh_تطوير_آخرين', label:'تطوير الآخرين', weight:0.10},
 {key:'beh_إدارة_مهام', label:'إدارة المهام', weight:0.10},

const APPS_SCRIPT_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';

async function storeGet(key, def, shared=true){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) return def;
    const data = await res.json();
    if(data && data.found) return JSON.parse(data.value);
    return def;
  }catch(e){ console.error('storage get error', e); return def; }
}
async function storeSet(key, val, shared=true){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // نستخدم text/plain عمداً لتفادي مشاكل CORS preflight
      body: JSON.stringify({ action:'set', key, value: JSON.stringify(val) })
    });
    if(!res.ok) return false;
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){ console.error('storage set error', e); return false; }
}

/* ---------------- Task-log engine (مرجعي/معلوماتي فقط، لا يتحكم بالدرجة مباشرة) ---------------- */
function findWorktype(id){ return state.worktypes.find(w=>w.id===id); }
function findEmployee(id){ return state.employees.find(e=>e.id===id); }

function taskEquivalent(task){
  let eq;
  if(task.custom){ eq = Number(task.proposedEquivalent)||0; }
  else {
    const wt = findWorktype(task.worktypeId);
    if(!wt) return 0;
    const rule = wt.rules[task.category];
    if(!rule) return 0;
    if(rule.mode==='fixed') eq = (Number(task.quantity)||0) * rule.value;
    else if(rule.mode==='ratio') eq = (Number(task.quantity)||0) / rule.value;
    else if(rule.mode==='ratio_words') eq = (Number(task.wordCount)||0) / rule.value;
    else eq = 0;
  }
  if(task.isRevision) eq = eq * (state.revisionFactor!=null? state.revisionFactor : DEFAULT_REVISION_FACTOR);
  return eq;
}
function employeeShareOfTask(task, employeeId){
  const total = taskEquivalent(task);
  if(!task.collaborators || task.collaborators.length===0){
    return task.employeeId===employeeId ? total : 0;
  }
  const c = task.collaborators.find(c=>c.employeeId===employeeId);
  if(!c) return 0;
  return total * (Number(c.pct)||0)/100;
}
function computedTextCount(employeeId){
  let byCat = {كتابة:0, مراجعة:0, ترجمة:0};
  state.tasks.forEach(t=>{
    if(t.status==='pending') return;
    const share = employeeShareOfTask(t, employeeId);
    if(share>0) byCat[t.category] = (byCat[t.category]||0) + share;
  });
  const total = byCat.كتابة + byCat.مراجعة*0.5 + byCat.ترجمة;
  return { total, byCat };
}
function computedDistinctTypes(employeeId){
  const set = new Set();
  state.tasks.forEach(t=>{
    if(t.status==='pending') return;
    const share = employeeShareOfTask(t, employeeId);
    if(share>0) set.add(t.custom? ('custom:'+(t.customName||'')) : t.worktypeId);
  });
  return set.size;
}
function getKpiAchieved(employeeId, ind){
  if(ind.auto==='text') return computedTextCount(employeeId).total;
  if(ind.auto==='types') return computedDistinctTypes(employeeId);
  if(ind.annual) return (state.annualManual[employeeId])||0;
  return ((state.manual[employeeId]||{})[ind.key])||0;
}
function teamAvgAchieved(role, ind){
  const emps = state.employees.filter(e=>e.role===role);
  if(!emps.length) return null;
  const vals = emps.map(e=>getKpiAchieved(e.id, ind));
  const sum = vals.reduce((a,b)=>a+b,0);
  return sum/emps.length;
}
function scoreFromPercent(pct){
  if(pct===null || pct===undefined || isNaN(pct)) return null;
  if(pct<50) return null;
  if(pct<70) return 1;
  if(pct<90) return 2;
  if(pct<110) return 3;
  if(pct<130) return 4;
  return 5;
}
function pendingTasksFor(employeeId){
  return state.tasks.filter(t=>t.status==='pending' && (t.employeeId===employeeId || (t.collaborators||[]).some(c=>c.employeeId===employeeId)));
}
function allPending(){ return state.tasks.filter(t=>t.status==='pending'); }
function ruleText(rule){
  if(!rule) return '<span style="color:var(--ink-500)">—</span>';
  if(rule.mode==='fixed') return `${rule.value} نص/عمل`;
  if(rule.mode==='ratio') return `كل ${rule.value} = نص`;
  if(rule.mode==='ratio_words') return `كل ${rule.value} كلمة = نص`;
  return '—';
}

/* ---------------- Rating engine (self + manager, 1-5) ---------------- */
function kpiWeightOf(role, key){
  const w = state.weights.kpi && state.weights.kpi[role];
  if(w && w[key]!=null) return w[key];
  return (DEFAULT_WEIGHTS.kpi[role]||{})[key] || 0;
}
function behWeightOf(key){ return (state.weights.beh && state.weights.beh[key]!=null) ? state.weights.beh[key] : DEFAULT_WEIGHTS.beh[key]; }

function getRating(employeeId, ind){
  if(ind.annual) return (state.annualRatings[employeeId]) || {};
  return ((state.ratings[employeeId]||{})[ind.key]) || {};
}
async function setRating(employeeId, ind, field, value){
  if(ind.annual){
    if(!state.annualRatings[employeeId]) state.annualRatings[employeeId] = {};
    state.annualRatings[employeeId][field] = value;
    await storeSet(annualRatingsKey(), state.annualRatings);
  } else {
    if(!state.ratings[employeeId]) state.ratings[employeeId] = {};
    if(!state.ratings[employeeId][ind.key]) state.ratings[employeeId][ind.key] = {};
    state.ratings[employeeId][ind.key][field] = value;
    await storeSet(ratingsKey(), state.ratings);
  }
}
function tierLabel(score){
  if(score===null || score===undefined) return '—';
  if(score<2) return 'لا يواكب التوقعات';
  if(score<3) return 'يواكب التوقعات جزئياً';
  if(score<4) return 'يواكب التوقعات';
  if(score<4.5) return 'يتجاوز التوقعات';
  return 'استثنائي';
}
function evaluateSection(employeeId, indicators){
  let wsum=0, sum=0, selfWsum=0, selfSum=0;
  const rows = indicators.map(ind=>{
    const r = getRating(employeeId, ind);
    const w = behWeightOf(ind.key);
    if(r.manager){ wsum+=w; sum+=r.manager*w; }
    if(r.self){ selfWsum+=w; selfSum+=r.self*w; }
    return { ...ind, weight:w, self:r.self||null, manager:r.manager||null };
  });
  return { rows, avg: wsum>0? sum/wsum : null, selfAvg: selfWsum>0? selfSum/selfWsum : null };
}
function evaluateKpiSection(employeeId){
  const emp = findEmployee(employeeId);
  const role = (emp && emp.role) || 'كاتب';
  const mins = (state.mins && state.mins[role]) || minsForRole(role);
  const indicators = kpiIndicatorsForRole(role);
  let wsum=0, sum=0;
  const rows = indicators.map(ind=>{
    const achieved = getKpiAchieved(employeeId, ind);
    const min = (mins && mins[ind.key]) || 0;
    const pct = min>0 ? (achieved/min*100) : 0;
    const score = scoreFromPercent(pct);
    const w = kpiWeightOf(role, ind.key);
    if(score!==null){ wsum+=w; sum+=score*w; }
    return { ...ind, achieved, min, pct, score, weight:w };
  });
  return { rows, avg: wsum>0? sum/wsum : null };
}
function evaluateEmployee(employeeId){
  const emp = findEmployee(employeeId);
  if(!emp) return null;
  const kpi = evaluateKpiSection(employeeId);
  const beh = evaluateSection(employeeId, BEHAVIORAL_INDICATORS);
  const combine = (a,b)=> a!==null && b!==null ? 0.5*a+0.5*b : (a!==null? a : b);
  const final = combine(kpi.avg, beh.avg);
  const selfFinal = combine(kpi.avg, beh.selfAvg);
  return { emp, kpi, beh, final, selfFinal, tier:tierLabel(final), selfTier:tierLabel(selfFinal) };
}

/* ---------------- Excel export ---------------- */
function exportExcel(employeeList){
  const list = employeeList || state.employees;
  const listIds = new Set(list.map(e=>e.id));
  const wb = XLSX.utils.book_new();
  const kpiUnion = kpiUnionList();
  const kpiLabels = kpiUnion.map(i=>i.label);
  const behLabels = BEHAVIORAL_INDICATORS.map(i=>i.label);
  const summary = [['الاسم','الدور','النتيجة النهائية (مدير)','التصنيف','النتيجة الذاتية التقديرية',
    ...kpiLabels.map(l=>l+' — المحقق'), ...kpiLabels.map(l=>l+' — الدرجة'),
    ...behLabels.map(l=>l+' — ذاتي'), ...behLabels.map(l=>l+' — مدير')]];
  list.forEach(emp=>{
    const ev = evaluateEmployee(emp.id);
    const rowByKey = {}; ev.kpi.rows.forEach(r=>{ rowByKey[r.key]=r; });
    const kpiAchieved = kpiUnion.map(i=> rowByKey[i.key] ? Math.round(rowByKey[i.key].achieved*100)/100 : '—');
    const kpiScores = kpiUnion.map(i=> rowByKey[i.key] ? (rowByKey[i.key].score===null?'—':rowByKey[i.key].score) : '—');
    const behSelf = ev.beh.rows.map(r=>r.self ?? '—');
    const behMgr = ev.beh.rows.map(r=>r.manager ?? '—');
    summary.push([emp.name, emp.role, ev.final!==null?Math.round(ev.final*100)/100:'—', ev.tier, ev.selfFinal!==null?Math.round(ev.selfFinal*100)/100:'—', ...kpiAchieved, ...kpiScores, ...behSelf, ...behMgr]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  XLSX.utils.book_append_sheet(wb, ws1, 'ملخص التقييم');

  const taskRows = [['الربع','الموظف','التصنيف','نوع العمل','الكمية','ما يعادل (نص) — مرجعي','حالة']];
  state.tasks.filter(t=>listIds.has(t.employeeId)).forEach(t=>{
    const wt = t.custom ? (t.customName||'مهمة غير قياسية') : (findWorktype(t.worktypeId)||{}).name;
    taskRows.push([qKey(), (findEmployee(t.employeeId)||{}).name||'', t.category, wt, t.custom?'-':t.quantity, Math.round(taskEquivalent(t)*100)/100, t.status==='pending'?'بانتظار المراجعة':'معتمد']);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(taskRows);
  XLSX.utils.book_append_sheet(wb, ws2, 'سجل الأعمال (مرجعي)');

  XLSX.writeFile(wb, `تقييم_متم_${qKey()}.xlsx`);
  showToast('تم تنزيل ملف الإكسل');
}

function renderTopbar(){
  const titles = {
    dashboard:['لوحتي','قيّمي نفسك ذاتياً لكل مؤشر — تقييم المدير يظهر هنا بعد اعتماده'],
    log:['سجل أعمالي','معلومة مرجعية مساعِدة: عدد النصوص المحسوب تلقائياً من أعمالك (لا يُحدد الدرجة مباشرة)'],
    reference:['مرجع الاحتساب','جدول تحويل أنواع الأعمال إلى نصوص معادلة — مرجعي'],
    overview:['نظرة عامة','نتائج تقييم فريقك المباشر هذا الربع — خاصة بك فقط'],
    rate:['تقييم المدير','قيّم كل مؤشر من 1-5 لكل كاتب — يُقارَن بتقييمه الذاتي'],
    pending:['مهام بانتظار المراجعة','أعمال غير قياسية أدخلها الكتّاب بحاجة لاعتماد قيمة معادلة'],
    employees:['الموظفون','إدارة الكتّاب وأدوارهم'],
    settings:['أوزان المؤشرات','وزن كل مؤشر داخل قسمه — يحدد أثره في الدرجة النهائية'],
    activity:['سجل التعديلات','كل التغييرات التي جرت على المنصة — الموظفون، المرجع، الاعتمادات، الإعدادات'],
  };
  const [t,d] = titles[state.view] || ['',''];
  const qOptions = [1,2,3,4].map(q=>`<option value="${q}" ${state.quarter===q?'selected':''}>الربع ${q}</option>`).join('');
  const activeEvaluator = state.activeEvaluatorId ? findEmployee(state.activeEvaluatorId) : null;
  const activeWriter = state.activeWriterId ? findEmployee(state.activeWriterId) : null;
  const evaluatorBadge = state.adminMode && (state.view==='rate'||state.view==='overview') && activeEvaluator
    ? `<span class="tag tag-brand">مسجّلة كـ: ${activeEvaluator.name}</span><button class="btn btn-ghost btn-sm" id="btnSwitchEvaluator">تبديل الهوية</button>` : '';
  const writerBadge = !state.adminMode && activeWriter
    ? `<span class="tag tag-brand">أنتِ: ${activeWriter.name}</span><button class="btn btn-ghost btn-sm" id="btnSwitchWriter">تبديل</button>` : '';
  return `
  <div class="topbar">
    <div>
      <h2>${t}</h2>
      <div class="desc">${d}</div>
    </div>
    <div class="grow"></div>
    ${evaluatorBadge}${writerBadge}
    <select id="quarterSel">${qOptions}</select>
    <input type="number" id="yearSel" value="${state.year}" style="width:78px" />
    <div class="pill-toggle">
      <button data-mode="writer" class="${!state.adminMode?'active':''}">كاتب</button>
      <button data-mode="admin" class="${state.adminMode?'active':''}">إدارة</button>
    </div>
  </div>`;
}

function renderView(){
  switch(state.view){
    case 'dashboard': return renderDashboard();
    case 'log': return renderLog();
    case 'reference': return renderReference();
    case 'overview': return renderOverview();
    case 'rate': return renderManagerRate();
    case 'pending': return renderPending();
    case 'employees': return renderEmployees();

}

/* ---- Shared: indicator table renderer ---- */
function renderKpiTable(rows, employeeId, editable){
  return `<table>
    <thead><tr><th>المؤشر</th><th>الوزن</th><th>المحقق</th><th>الحد الأدنى</th><th>النسبة</th><th>الدرجة</th></tr></thead>
    <tbody>
    ${rows.map(r=>{
      const tagClass = r.score===null?'tag-mute':(r.score>=3?'tag-brand':(r.score>=2?'tag-brass':'tag-brick'));
      const isAuto = !!r.auto;
      const achievedCell = isAuto
        ? `<span class="num">${fmt(r.achieved)}</span>`
        : (editable
            ? `<input type="number" class="num" style="width:75px" data-manual="${employeeId}|${r.key}|${r.annual?1:0}" value="${r.achieved}">`
            : `<span class="num">${fmt(r.achieved)}</span>`);
      let extra = '';
      if(isAuto) extra = `<div style="font-size:11px;color:var(--ink-500)">محتسَب تلقائياً من سجل الأعمال</div>`;
      if(r.annual) extra += `<div style="font-size:11px;color:var(--ink-500)">سنوي — يبقى نفسه طوال أرباع ${state.year}</div>`;
      return `<tr>
        <td>${r.label}${extra}</td>
        <td class="weight-badge num">${r.weight}</td>
        <td>${achievedCell} <span style="font-size:11px;color:var(--ink-500)">${r.unit||''}</span></td>
        <td class="num">${fmt(r.min)}</td>
        <td class="num">${fmt(r.pct)}%</td>
        <td><span class="tag ${tagClass}">${r.score===null?'—':r.score}</span></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}
function kpiTotalHtml(kpiEval){
  return `<div class="section-total"><span>إجمالي الأداء الوظيفي</span><span class="num">${kpiEval.avg!==null?fmt(kpiEval.avg):'—'} / 5</span></div>`;
}
function renderIndicatorTable(employeeId, indicators, editableField){
  const rows = indicators.map(ind=>{
    const r = getRating(employeeId, ind);
    const bandScore = r.manager ?? r.self ?? null;
    const band = tierLabel(bandScore);
    const bandTagClass = bandScore===null ? 'tag-mute' : (bandScore>=3 ? 'tag-brand' : (bandScore>=2? 'tag-brass':'tag-brick'));
    let extra = '';
    if(ind.annual) extra += `<div style="font-size:11px;color:var(--ink-500)">تقييم سنوي — يبقى ذاته طوال أرباع ${state.year} (المطلوب: دورتان/نشاطان على الأقل)</div>`;
    return `<tr>
      <td>${ind.label}${extra}</td>
      <td class="weight-badge num">${behWeightOf(ind.key)}</td>
      <td>${renderChips(employeeId, ind, 'self', editableField==='self', r.self)}</td>
      <td>${renderChips(employeeId, ind, 'manager', editableField==='manager', r.manager)}</td>
      <td><span class="tag ${bandTagClass}">${band}</span></td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr><th>المؤشر</th><th>الوزن</th><th>التقييم الذاتي</th><th>تقييم المدير</th><th>التقييم الوصفي</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
function renderChips(employeeId, ind, field, editable, current){
  const chips = [1,2,3,4,5].map(n=>{
    const on = current===n ? 'on':'';
    const locked = editable? '' : 'locked';
    const dataAttr = editable? `data-rate="${employeeId}|${ind.key}|${ind.annual?1:0}|${field}|${n}"` : 'disabled';
    return `<button type="button" class="rate-chip ${on} ${locked}" ${dataAttr}>${n}</button>`;
  }).join('');
  return `<div class="rate-chips">${chips}</div>`;
}
function sectionTotalsHtml(sectionEval, label){
  return `<div class="section-total"><span>${label}</span><span class="num">تقييم ذاتي: ${fmt(sectionEval.selfAvg)} &nbsp;|&nbsp; تقييم المدير: ${fmt(sectionEval.avg)}</span></div>`;
}

              <input type="number" data-min="${role}|${ind.key}" value="${curVal}" style="flex:1">
              ${avg!==null? `<button type="button" class="btn btn-ghost btn-sm" data-fillavg="${role}|${ind.key}|${Math.round(avg*10)/10}" title="متوسط الفريق حتى الآن">≈${fmt(avg)}</button>`:''}
            </div>
          </label>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3>أوزان الأداء الوظيفي — لكل دور مؤشراته وأوزانه الخاصة</h3>
    <div class="hint">مؤشرات الكاتب تختلف عن الكاتب الأول (مثال: الكاتب يُقاس بالحملات التسويقية وجلب المشاريع، والكاتب الأول بقيادة الفريق وملازمة الكتّاب). مجموع الأوزان داخل كل دور يُطبَّع تلقائياً عند الحساب.</div>
    <div class="grid grid-3">
    ${['كاتب','كاتب أول','مدير الكتّاب'].map(role=>`
      <div>
        <div style="font-weight:700;margin-bottom:8px">${role}</div>
        ${kpiIndicatorsForRole(role).map(ind=>`<label class="field" style="margin-bottom:8px">${ind.label}<input type="number" step="0.01" data-kpiweight="${role}|${ind.key}" value="${kpiWeightOf(role, ind.key)}"></label>`).join('')}
      </div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3>أوزان الكفاءة السلوكية</h3>
    <div class="hint">مشتركة بين كل الأدوار.</div>
    <div class="grid grid-4">
    ${BEHAVIORAL_INDICATORS.map(ind=>`<label class="field">${ind.label}<input type="number" step="0.01" data-weight="${ind.key}" value="${behWeightOf(ind.key)}"></label>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3>معامل احتساب التعديلات (بعد التسليم)</h3>
    <div class="hint">أي عمل يُعلَّم "تعديل على عمل مسلَّم سابقاً" يُحتسب بهذه النسبة من قيمته الأصلية بدل قيمته الكاملة — لتفادي الظلم بالنقص (تجاهل الجهد) أو بالزيادة (احتساب نص مكرر بقيمة كاملة).</div>
    <label class="field" style="max-width:200px">النسبة (0 إلى 1)<input type="number" step="0.05" min="0" max="1" id="revisionFactorInput" value="${state.revisionFactor}"></label>
  </div>
  <button class="btn btn-brand" id="btnSaveSettings">حفظ الحدود والأوزان والمعامل</button>

  <div class="card" style="margin-top:24px">
    <h3>كلمة مرور لوحة الإدارة</h3>
    <div class="hint">أي شخص يدخل هذه الكلمة يدخل وضع الإدارة الكامل (الوظائف التشغيلية: الموظفون، المرجع، المهام المعلّقة، الإعدادات، سجل التعديلات). تسجيل دخول "تقييم المدير" منفصل وله كود شخصي لكل مقيّم. هذه حماية أساسية لمنع الدخول العرضي — وليست تشفيراً كاملاً، لأن الكود يعمل من طرف المتصفح.</div>
    <label class="field" style="max-width:260px">كلمة مرور جديدة<input type="password" id="newAdminPw" placeholder="اتركيه فارغاً لعدم التغيير"></label>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" id="btnChangePw">تحديث كلمة المرور</button>
  </div>`;
}

/* ---- Admin: activity log ---- */
function renderActivity(){
  const log = state.activityLog || [];
  return `
  <div class="card">
    ${log.length? `
    <table>
      <thead><tr><th>الوقت</th><th>الإجراء</th></tr></thead>
      <tbody>
      ${log.map(e=>`<tr><td class="num" style="white-space:nowrap;color:var(--ink-500);font-size:12px">${fmtTs(e.ts)}</td><td>${e.text}</td></tr>`).join('')}
      </tbody>
    </table>` : `<div class="empty"><div class="ic">🕘</div>لا توجد تعديلات مسجّلة بعد.</div>`}
  </div>`;
}

function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (Math.round(n*100)/100).toLocaleString('en-US'); }

/* ================= Handlers ================= */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.view = el.dataset.nav; render(); };
  });
  const modeBtns = document.querySelectorAll('.pill-toggle button');
  modeBtns.forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.mode==='admin'){
        if(state.adminUnlocked){
          state.adminMode = true; state.view='employees'; render();
        } else {
          openAdminGate(()=>{ state.adminUnlocked = true; state.adminMode = true; state.view='employees'; render(); });
        }
      } else {
        state.adminMode = false;
        if(state.activeWriterId){ state.currentEmployee = state.activeWriterId; state.view = 'dashboard'; render(); }
        else { openWriterGate(); }
      }
    };
  });
  const qSel = document.getElementById('quarterSel');
  if(qSel) qSel.onchange = async ()=>{ state.quarter = Number(qSel.value); await reloadQuarterData(); render(); };
  const ySel = document.getElementById('yearSel');
  if(ySel) ySel.onchange = async ()=>{ state.year = Number(ySel.value)||state.year; await reloadQuarterData(); render(); };
  const rateSel = document.getElementById('rateTargetSel');
  if(rateSel) rateSel.onchange = ()=>{ state.ratingTarget = rateSel.value; render(); };

  document.querySelectorAll('[data-openRate]').forEach(b=>{
    b.onclick = ()=>{ state.ratingTarget = b.dataset.openrate || b.getAttribute('data-openRate'); state.view='rate'; render(); };
  });

  const btnOpenEvalGate = document.getElementById('btnOpenEvaluatorGate');
  if(btnOpenEvalGate) btnOpenEvalGate.onclick = openEvaluatorGate;
  const btnSwitchEval = document.getElementById('btnSwitchEvaluator');
  if(btnSwitchEval) btnSwitchEval.onclick = ()=>{ state.activeEvaluatorId = null; state.ratingTarget = null; openEvaluatorGate(); };
  const btnSwitchWriter = document.getElementById('btnSwitchWriter');
  if(btnSwitchWriter) btnSwitchWriter.onclick = ()=>{ state.activeWriterId = null; state.currentEmployee = null; openWriterGate(); };
  const btnOpenWriterGate = document.getElementById('btnOpenWriterGate');
  if(btnOpenWriterGate) btnOpenWriterGate.onclick = openWriterGate;

  document.querySelectorAll('[data-rate]').forEach(b=>{
    b.onclick = async ()=>{
      const [empId, rowKey, annualFlag, field, val] = b.dataset.rate.split('|');
      const ind = ALL_INDICATORS.find(i=>i.key===rowKey);
      await setRating(empId, ind, field, Number(val));
      showToast('تم حفظ التقييم');
      render();
    };
  });

  const btnAddTask = document.getElementById('btnAddTask');
  if(btnAddTask) btnAddTask.onclick = ()=>openTaskModal(null);

  document.querySelectorAll('[data-editTask]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.edittask || b.getAttribute('data-editTask');
      const task = state.tasks.find(t=>t.id===id);
      if(task) openTaskModal(task);
    };
  });
  document.querySelectorAll('[data-deleteTask]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('حذف هذا العمل نهائياً؟ لن يُحتسب ضمن نصوصك بعد الحذف.')) return;
      const id = b.dataset.deletetask || b.getAttribute('data-deleteTask');
      const backup = state.tasks;
      state.tasks = state.tasks.filter(t=>t.id!==id);
      const ok = await storeSet(tasksKey(), state.tasks);
      if(!ok){ state.tasks = backup; showToast('⚠️ فشل الحذف — تحقّقي من الاتصال'); return; }
      showToast('تم حذف العمل');
      render();
    };
  });

  const btnAddWt = document.getElementById('btnAddWt');
  if(btnAddWt) btnAddWt.onclick = async ()=>{
    const name = document.getElementById('wtName').value.trim();
    if(!name){ showToast('أدخلي اسم نوع العمل'); return; }
    const rules = {};
    CATS.forEach(c=>{
      const mode = document.getElementById(`wtMode_${c}`).value;
      const val = Number(document.getElementById(`wtVal_${c}`).value);
      if(mode && val>0) rules[c] = {mode, value:val};
    });
    state.worktypes.push({id:'wt_'+uid(), name, rules});
    await storeSet('worktypes', state.worktypes);
    await logActivity(`إضافة نوع عمل جديد للمرجع: «${name}»`);
    showToast('تمت إضافة نوع العمل — متاح الآن لكل الفريق');
    render();
  };

  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.onclick = ()=>exportExcel(state.employees.filter(e=>e.evaluatorId===state.activeEvaluatorId));

  document.querySelectorAll('[data-approve]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.approve;
      const val = Number(document.getElementById('approveVal_'+id).value)||0;
      const t = state.tasks.find(x=>x.id===id);
      t.status='approved'; t.proposedEquivalent = val;
      await storeSet(tasksKey(), state.tasks);
      await logActivity(`اعتماد مهمة غير قياسية لـ«${(findEmployee(t.employeeId)||{}).name||''}»: ${t.customName||''} (${val} نص)`);
      showToast('تم اعتماد المهمة');
      render();
    };
  });
  document.querySelectorAll('[data-reject]').forEach(b=>{
    b.onclick = async ()=>{
      const t = state.tasks.find(x=>x.id===b.dataset.reject);
      state.tasks = state.tasks.filter(x=>x.id!==b.dataset.reject);
      await storeSet(tasksKey(), state.tasks);
      if(t) await logActivity(`رفض مهمة غير قياسية لـ«${(findEmployee(t.employeeId)||{}).name||''}»: ${t.customName||''}`);
      showToast('تم رفض المهمة');
      render();
    };
  });

  const btnAddEmp = document.getElementById('btnAddEmp');
  if(btnAddEmp) btnAddEmp.onclick = async ()=>{
    const name = prompt('اسم الموظف الجديد؟');
    if(!name) return;
    const defaultEvaluator = state.employees.find(e=>e.isEvaluator && e.role!=='مدير عام');
    state.employees.push({id:'e_'+uid(), name, role:'كاتب', evaluatorId: defaultEvaluator? defaultEvaluator.id : null, isEvaluator:false, code:genCode()});
    await storeSet('employees', state.employees);
    await logActivity(`إضافة موظف جديد: «${name}»`);
    render();
  };
  document.querySelectorAll('[data-roleFor]').forEach(sel=>{
    sel.onchange = async ()=>{
      const emp = findEmployee(sel.dataset.rolefor || sel.getAttribute('data-roleFor'));
      const oldRole = emp.role;
      emp.role = sel.value;
      await storeSet('employees', state.employees);
      await logActivity(`تغيير دور «${emp.name}» من "${oldRole}" إلى "${emp.role}"`);
      showToast('تم تحديث الدور');
      render();
    };
  });
  document.querySelectorAll('[data-evaluatorFor]').forEach(sel=>{
    sel.onchange = async ()=>{
      const emp = findEmployee(sel.dataset.evaluatorfor || sel.getAttribute('data-evaluatorFor'));
      emp.evaluatorId = sel.value || null;
      await storeSet('employees', state.employees);
      await logActivity(`تحديد المسؤول عن تقييم «${emp.name}»: ${sel.value? (findEmployee(sel.value)||{}).name : 'بلا'}`);
      showToast('تم التحديث');
    };
  });
  document.querySelectorAll('[data-isEvalFor]').forEach(cb=>{
    cb.onchange = async ()=>{
      const emp = findEmployee(cb.dataset.isevalfor || cb.getAttribute('data-isEvalFor'));
      emp.isEvaluator = cb.checked;
      await storeSet('employees', state.employees);
      await logActivity(`${cb.checked? 'تفعيل':'إلغاء'} صلاحية التقييم لـ«${emp.name}»`);
      showToast('تم التحديث');
      render();
    };
  });
  document.querySelectorAll('[data-codeFor]').forEach(inp=>{
    inp.onchange = async ()=>{
      const emp = findEmployee(inp.dataset.codefor || inp.getAttribute('data-codeFor'));
      emp.evaluatorCode = inp.value;
      await storeSet('employees', state.employees);
      await logActivity(`تحديث كود التقييم لـ«${emp.name}»`);
      showToast('تم حفظ الكود');
    };
  });
  document.querySelectorAll('[data-writerCodeFor]').forEach(inp=>{
    inp.onchange = async ()=>{
      const emp = findEmployee(inp.dataset.writercodefor || inp.getAttribute('data-writerCodeFor'));
      emp.code = inp.value;
      await storeSet('employees', state.employees);
      await logActivity(`تحديث كود لوحة «${emp.name}»`);
      showToast('تم حفظ الكود');
    };
  });
  document.querySelectorAll('[data-delEmp]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('حذف هذا الموظف؟')) return;
      const id = b.dataset.delemp||b.getAttribute('data-delEmp');
      const emp = findEmployee(id);
      state.employees = state.employees.filter(e=>e.id!==id);
      await storeSet('employees', state.employees);
      if(emp) await logActivity(`حذف الموظف: «${emp.name}»`);
      render();
    };
  });

  const btnBulkImport = document.getElementById('btnBulkImport');
  if(btnBulkImport) btnBulkImport.onclick = async ()=>{
    const raw = document.getElementById('bulkEmp').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length){ showToast('أدخلي قائمة الموظفين أولاً'); return; }
    const defaultEvaluator = state.employees.find(e=>e.isEvaluator && e.role!=='مدير عام');
    let count = 0;
    const newNames = [];
    lines.forEach(line=>{
      const parts = line.split(/\s*-\s*/);
      let name, role;
      if(parts.length>=2){
        role = parts[parts.length-1].trim();
        name = parts.slice(0,-1).join(' - ').trim();
        role = (role==='كاتب أول')? 'كاتب أول' : 'كاتب';
      } else {
        name = line; role = 'كاتب';
      }
      if(name){
        const code = genCode();
        state.employees.push({id:'e_'+uid(), name, role, evaluatorId: defaultEvaluator? defaultEvaluator.id : null, code});
        newNames.push(`${name}: ${code}`);
        count++;
      }
    });
    await storeSet('employees', state.employees);
    await logActivity(`استيراد جماعي: ${count} كاتب جديد`);
    document.getElementById('bulkEmp').value = '';
    const res = document.getElementById('bulkResult');
    res.style.display='block'; res.innerHTML = `تمت إضافة ${count} كاتب بنجاح. أكوادهم الشخصية (شاركيها معهم بأمان):<br>${newNames.join('<br>')}`;
    showToast(`تمت إضافة ${count} كاتب`);
    render();
  };

  const btnSaveSettings = document.getElementById('btnSaveSettings');
  if(btnSaveSettings) btnSaveSettings.onclick = async ()=>{
    document.querySelectorAll('[data-weight]').forEach(inp=>{
      state.weights.beh[inp.dataset.weight] = Number(inp.value)||0;
    });
    document.querySelectorAll('[data-kpiweight]').forEach(inp=>{
      const [role, key] = inp.dataset.kpiweight.split('|');
      if(!state.weights.kpi[role]) state.weights.kpi[role] = {};
      state.weights.kpi[role][key] = Number(inp.value)||0;
    });
    document.querySelectorAll('[data-min]').forEach(inp=>{
      const [role, key] = inp.dataset.min.split('|');
      if(!state.mins[role]) state.mins[role] = {};
      state.mins[role][key] = Number(inp.value)||0;
    });
    const revInput = document.getElementById('revisionFactorInput');
    if(revInput) state.revisionFactor = Math.max(0, Math.min(1, Number(revInput.value)||0));
    await storeSet('weights', state.weights);
    await storeSet(minsKey(), state.mins);
    await storeSet('revision_factor', state.revisionFactor);
    await logActivity(`تحديث الحدود الدنيا لربع ${qKey()} وأوزان المؤشرات ومعامل التعديل`);
    showToast('تم الحفظ');
    render();
  };

  document.querySelectorAll('[data-fillavg]').forEach(b=>{
    b.onclick = ()=>{
      const [role, key, avg] = b.dataset.fillavg.split('|');
      const inp = document.querySelector(`[data-min="${role}|${key}"]`);
      if(inp) inp.value = avg;
    };
  });

  document.querySelectorAll('[data-manual]').forEach(inp=>{
    inp.onchange = async ()=>{
      const [empId, key, annualFlag] = inp.dataset.manual.split('|');
      const val = Number(inp.value)||0;
      let ok;
      if(annualFlag==='1'){
        const prev = state.annualManual[empId];
        state.annualManual[empId] = val;
        ok = await storeSet(annualManualKey(), state.annualManual);
        if(!ok) state.annualManual[empId] = prev;
      } else {
        if(!state.manual[empId]) state.manual[empId] = {};
        const prev = state.manual[empId][key];
        state.manual[empId][key] = val;
        ok = await storeSet(manualKey(), state.manual);
        if(!ok) state.manual[empId][key] = prev;
      }
      if(!ok){ showToast('⚠️ فشل الحفظ — تحقّقي من الاتصال وحاولي مرة أخرى'); inp.value = val; return; }
      showToast('تم الحفظ');
      render();
    };
  });

  const btnChangePw = document.getElementById('btnChangePw');
  if(btnChangePw) btnChangePw.onclick = async ()=>{
    const val = document.getElementById('newAdminPw').value;
    if(!val){ showToast('لم يتم تغيير كلمة المرور'); return; }
    state.security.adminPassword = val;
    await storeSet('security', state.security);
    await logActivity('تغيير كلمة مرور لوحة الإدارة');
    showToast('تم تحديث كلمة المرور');
    document.getElementById('newAdminPw').value='';
  };
}

/* ---------------- Writer identity gate (خصوصية لوحة الكاتب) ---------------- */
function openWriterGate(){
  const writers = state.employees.filter(e=>WRITER_ROLES.includes(e.role));
  if(!writers.length){
    showToast('لا يوجد كتّاب مضافون بعد');
    return;
  }
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `
  <div class="modal" style="max-width:380px">
    <div class="row-flex" style="justify-content:space-between">
      <h3>تسجيل الدخول للوحتي</h3>
      <button class="close-x">✕</button>
    </div>
    <div class="hint">اختاري اسمك وأدخلي كودك الشخصي — لوحتك خاصة ولا يطّلع عليها إلا أنتِ ومديرك المباشر.</div>
    <label class="field">أنا<select id="gateWriterSel">${writers.map(w=>`<option value="${w.id}">${w.name} — ${w.role}</option>`).join('')}</select></label>
    <label class="field" style="margin-top:10px">الكود الشخصي<input type="password" id="gateWriterCode"></label>
    <div id="gateWriterErr" style="color:var(--brick);font-size:12px;margin-top:6px;display:none">الكود غير صحيح لهذا الاسم</div>
    <button class="btn btn-brand" style="margin-top:14px;width:100%" id="gateWriterGo">دخول</button>
  </div>`;
  document.body.appendChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector('.close-x').onclick = ()=> bg.remove();
  const codeInput = bg.querySelector('#gateWriterCode');
  const go = ()=>{
    const empId = bg.querySelector('#gateWriterSel').value;
    const emp = findEmployee(empId);
    if(emp && codeInput.value === emp.code){
      state.activeWriterId = empId;
      state.currentEmployee = empId;
      bg.remove();
      state.adminMode = false; state.view='dashboard';
      render();
    } else {
      bg.querySelector('#gateWriterErr').style.display='block';
      codeInput.value=''; codeInput.focus();
    }
  };
  bg.querySelector('#gateWriterGo').onclick = go;
  codeInput.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  codeInput.focus();
}

  }
  const bg = document.createElement('div');

  bg.innerHTML = `
  <div class="modal" style="max-width:380px">
    <div class="row-flex" style="justify-content:space-between">
      <h3>تسجيل الدخول كمقيّمة</h3>
      <button class="close-x">✕</button>
    </div>
    <div class="hint">اختاري اسمك ثم أدخلي كودك الشخصي لعرض من تحت إشرافك وتقييمهم فقط.</div>
    <label class="field">أنا<select id="gateEvalSel">${managers.map(m=>`<option value="${m.id}">${m.name} — ${m.role}</option>`).join('')}</select></label>
    <label class="field" style="margin-top:10px">الكود الشخصي<input type="password" id="gateEvalCode"></label>
    <div id="gateEvalErr" style="color:var(--brick);font-size:12px;margin-top:6px;display:none">الكود غير صحيح لهذا الاسم</div>
    <button class="btn btn-brand" style="margin-top:14px;width:100%" id="gateEvalGo">دخول</button>
  </div>`;
  document.body.appendChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector('.close-x').onclick = ()=> bg.remove();
  const codeInput = bg.querySelector('#gateEvalCode');
  const go = ()=>{
    const empId = bg.querySelector('#gateEvalSel').value;
    const emp = findEmployee(empId);
    if(emp && codeInput.value === emp.evaluatorCode){

      bg.querySelector('#gateEvalErr').style.display='block';

    }
  };
  bg.querySelector('#gateEvalGo').onclick = go;
  codeInput.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  codeInput.focus();
}

/* ---------------- Admin password gate ---------------- */
function openAdminGate(onSuccess){
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `
  <div class="modal" style="max-width:360px">
    <div class="row-flex" style="justify-content:space-between">
      <h3>دخول لوحة الإدارة</h3>
      <button class="close-x">✕</button>
    </div>
    <div class="hint">أدخلي كلمة مرور الإدارة للمتابعة.</div>
    <label class="field">كلمة المرور<input type="password" id="gatePw"></label>
    <div id="gateErr" style="color:var(--brick);font-size:12px;margin-top:6px;display:none">كلمة المرور غير صحيحة</div>
    <button class="btn btn-brand" style="margin-top:14px;width:100%" id="gateGo">دخول</button>
  </div>`;
  document.body.appendChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector('.close-x').onclick = ()=> bg.remove();
  const pwInput = bg.querySelector('#gatePw');
  const go = ()=>{
    const val = pwInput.value;
    if(val === (state.security && state.security.adminPassword)){
      bg.remove();
      onSuccess();
    } else {
      bg.querySelector('#gateErr').style.display='block';
      pwInput.value=''; pwInput.focus();
    }
  };
  bg.querySelector('#gateGo').onclick = go;
  pwInput.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  pwInput.focus();
}

/* ---------------- Task modal (مرجعي) ---------------- */
function openTaskModal(existingTask){
  const isEdit = !!existingTask;
  const wtOptions = state.worktypes.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');
  const empOptions = state.employees.filter(e=>e.id!==state.currentEmployee && WRITER_ROLES.includes(e.role)).map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `
  <div class="modal">
    <div class="row-flex" style="justify-content:space-between">
      <h3>${isEdit? 'تعديل العمل':'إضافة عمل جديد'}</h3>
      <button class="close-x">✕</button>
    </div>
    <div class="pill-toggle" style="margin-bottom:14px">
      <button type="button" data-kind="standard" class="${!isEdit || !existingTask.custom?'active':''}">من المرجع</button>
      <button type="button" data-kind="custom" class="${isEdit && existingTask.custom?'active':''}">عمل غير قياسي</button>
    </div>

    <label class="field" style="margin-bottom:10px"><span class="row-flex"><input type="checkbox" id="mRevision" style="width:auto" ${isEdit && existingTask.isRevision?'checked':''}> تعديل على عمل مسلَّم سابقاً (بعد التسليم)</span></label>
    <div id="revisionHint" class="footnote" style="display:${isEdit && existingTask.isRevision?'block':'none'}">سيُحتسب بنسبة ${Math.round((state.revisionFactor!=null?state.revisionFactor:DEFAULT_REVISION_FACTOR)*100)}% فقط من قيمته الأصلية، لأنه تعديل وليس عملاً جديداً بالكامل.</div>

    <div id="standardBlock">
      <label class="field">نوع العمل<select id="mWt">${wtOptions}</select></label>
      <label class="field" style="margin-top:10px">التصنيف<select id="mCat"></select></label>
      <label class="field" style="margin-top:10px" id="mQtyWrap">الكمية<input type="number" id="mQty" placeholder="مثال: 3"></label>
      <div id="mPreview" class="footnote"></div>
    </div>

    <div id="customBlock" style="display:none">
      <label class="field">وصف العمل<input type="text" id="mCustomName" placeholder="مثال: نص خاص لطلب عميل مميز"></label>
      <label class="field" style="margin-top:10px">التصنيف<select id="mCustomCat">${CATS.map(c=>`<option value="${c}">${CAT_LABEL[c]}</option>`).join('')}</select></label>
      <label class="field" style="margin-top:10px">القيمة المقترحة (نص معادل)<input type="number" step="0.1" id="mCustomVal" placeholder="اقتراحك — سيراجعها المسؤول"></label>
      <label class="field" style="margin-top:10px">ملاحظات (اختياري)<textarea id="mCustomNotes" rows="2"></textarea></label>
      <div class="footnote">سيُرسل هذا العمل لقائمة "بانتظار المراجعة" ولن يُحتسب حتى تعتمده الإدارة.</div>
    </div>

    <div style="margin-top:14px">
      <label class="field"><span class="row-flex"><input type="checkbox" id="mShared" style="width:auto" ${isEdit && existingTask.collaborators && existingTask.collaborators.length? 'checked':''}> عمل تشاركي (أكثر من كاتب)</span></label>
      <div id="collabWrap" style="display:${isEdit && existingTask.collaborators && existingTask.collaborators.length? 'block':'none'};margin-top:8px"></div>
    </div>

    <button class="btn btn-brand" style="margin-top:16px;width:100%" id="mSave">${isEdit? 'حفظ التعديلات':'حفظ العمل'}</button>
  </div>`;
  document.body.appendChild(bg);

  const catSel = bg.querySelector('#mCat');
  function refreshCats(){
    const wt = findWorktype(bg.querySelector('#mWt').value);
    const cats = wt? Object.keys(wt.rules) : CATS;
    catSel.innerHTML = cats.map(c=>`<option value="${c}">${CAT_LABEL[c]}</option>`).join('');
    if(isEdit && !existingTask.custom && cats.includes(existingTask.category)) catSel.value = existingTask.category;
    refreshPreview();
  }
  function refreshPreview(){
    const wt = findWorktype(bg.querySelector('#mWt').value);
    const cat = catSel.value;
    const rule = wt? wt.rules[cat] : null;
    const qtyWrap = bg.querySelector('#mQtyWrap');
    let qtyLabel = 'الكمية';
    if(rule && rule.mode==='ratio_words') qtyLabel = 'عدد الكلمات';
    bg.querySelector('#mQtyWrap').firstChild.textContent = qtyLabel;
    const qty = Number(bg.querySelector('#mQty').value)||0;
    let eq = 0;
    if(rule){
      if(rule.mode==='fixed') eq = qty*rule.value;
      else eq = qty/rule.value;
    }
    const isRevision = bg.querySelector('#mRevision').checked;
    if(isRevision) eq = eq * (state.revisionFactor!=null? state.revisionFactor : DEFAULT_REVISION_FACTOR);
    bg.querySelector('#mPreview').textContent = rule? `يعادل تقريباً: ${fmt(eq)} نص (${ruleText(rule).replace(/<[^>]+>/g,'')}${isRevision?' × معامل التعديل':''})` : 'اختر تصنيفاً مدعوماً لهذا النوع';
  }
  bg.querySelector('#mWt').onchange = refreshCats;
  catSel.onchange = refreshPreview;
  bg.querySelector('#mQty').oninput = refreshPreview;
  bg.querySelector('#mRevision').onchange = (e)=>{
    bg.querySelector('#revisionHint').style.display = e.target.checked? 'block':'none';
    refreshPreview();
  };

  // تعبئة مسبقة عند التعديل
  if(isEdit){
    if(existingTask.custom){
      bg.querySelector('#mCustomName').value = existingTask.customName||'';
      bg.querySelector('#mCustomCat').value = existingTask.category;
      bg.querySelector('#mCustomVal').value = existingTask.proposedEquivalent||0;
      bg.querySelector('#mCustomNotes').value = existingTask.notes||'';
    } else {
      bg.querySelector('#mWt').value = existingTask.worktypeId;
      bg.querySelector('#mQty').value = existingTask.wordCount!=null? existingTask.wordCount : (existingTask.quantity||'');
    }
  }
  refreshCats();

  bg.querySelectorAll('[data-kind]').forEach(btn=>{
    btn.onclick = ()=>{
      bg.querySelectorAll('[data-kind]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const std = btn.dataset.kind==='standard';
      bg.querySelector('#standardBlock').style.display = std?'block':'none';
      bg.querySelector('#customBlock').style.display = std?'none':'block';
    };
  });

  const collabWrap = bg.querySelector('#collabWrap');
  let collabRows = [];
  bg.querySelector('#mShared').onchange = (e)=>{
    collabWrap.style.display = e.target.checked? 'block':'none';
    if(e.target.checked && collabRows.length===0) addCollabRow();
  };
  function addCollabRow(presetEmpId, presetPct){
    const id = uid();
    collabRows.push(id);
    const row = document.createElement('div');
    row.className='collab-row';
    row.dataset.id=id;
    row.innerHTML = `<select style="flex:1">${empOptions}</select><input type="number" placeholder="%" style="width:60px" value="${presetPct!=null?presetPct:50}"><button type="button" class="close-x" data-rm>✕</button>`;
    if(presetEmpId) row.querySelector('select').value = presetEmpId;
    row.querySelector('[data-rm]').onclick = ()=>{ row.remove(); collabRows = collabRows.filter(x=>x!==id); };
    collabWrap.insertBefore(row, collabWrap.lastElementChild);
  }
  const addCollabBtn = document.createElement('button');
  addCollabBtn.textContent='+ إضافة مشارك';
  addCollabBtn.className='btn btn-ghost btn-sm';
  addCollabBtn.type='button';
  addCollabBtn.onclick = ()=>addCollabRow();
  collabWrap.appendChild(addCollabBtn);

  if(isEdit && existingTask.collaborators && existingTask.collaborators.length){
    existingTask.collaborators.filter(c=>c.employeeId!==state.currentEmployee).forEach(c=>addCollabRow(c.employeeId, c.pct));
  }

  bg.querySelector('.close-x').onclick = ()=> bg.remove();
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };

  bg.querySelector('#mSave').onclick = async ()=>{
    const isCustom = bg.querySelector('[data-kind="custom"]').classList.contains('active');
    const isRevision = bg.querySelector('#mRevision').checked;
    const shared = bg.querySelector('#mShared').checked;
    let collaborators = [];
    if(shared){
      collaborators = Array.from(collabWrap.querySelectorAll('.collab-row')).map(r=>({
        employeeId: r.querySelector('select').value,
        pct: Number(r.querySelector('input').value)||0
      }));
      const selfPct = 100 - collaborators.reduce((s,c)=>s+c.pct,0);
      collaborators.push({employeeId: state.currentEmployee, pct: selfPct});
    }
    let task;
    if(isCustom){
      const name = bg.querySelector('#mCustomName').value.trim();
      if(!name){ showToast('أدخلي وصف العمل'); return; }
      task = {
        id: isEdit? existingTask.id : 't_'+uid(), employeeId:state.currentEmployee, custom:true, isRevision,
        customName:name, category:bg.querySelector('#mCustomCat').value,
        proposedEquivalent:Number(bg.querySelector('#mCustomVal').value)||0,
        notes:bg.querySelector('#mCustomNotes').value, collaborators,
        status:'pending', date: isEdit? existingTask.date : new Date().toISOString()
      };
    } else {
      const wtId = bg.querySelector('#mWt').value;
      const cat = catSel.value;
      const wt = findWorktype(wtId);
      const rule = wt.rules[cat];
      const qty = Number(bg.querySelector('#mQty').value)||0;
      if(qty<=0){ showToast('أدخلي كمية صحيحة'); return; }
      task = {
        id: isEdit? existingTask.id : 't_'+uid(), employeeId:state.currentEmployee, custom:false, isRevision,
        worktypeId:wtId, category:cat,
        quantity: rule && rule.mode==='ratio_words'? undefined : qty,
        wordCount: rule && rule.mode==='ratio_words'? qty : undefined,
        collaborators, status:'approved', date: isEdit? existingTask.date : new Date().toISOString()
      };
    }
    if(isEdit){
      const idx = state.tasks.findIndex(t=>t.id===existingTask.id);
      if(idx>-1) state.tasks[idx] = task;
    } else {
      state.tasks.push(task);
    }
    const saveBtn = bg.querySelector('#mSave');
    saveBtn.disabled = true; saveBtn.textContent = 'جارِ الحفظ...';
    const ok = await storeSet(tasksKey(), state.tasks);
    if(!ok){
      showToast('⚠️ فشل الحفظ — تحقّقي من الاتصال وحاولي مرة أخرى');
      saveBtn.disabled = false; saveBtn.textContent = isEdit? 'حفظ التعديلات':'حفظ العمل';
      return;
    }
    showToast(isEdit? 'تم حفظ التعديلات' : (isCustom? 'أُرسل للمراجعة':'تمت إضافة العمل'));
    bg.remove();
    render();
  };
}

/* ---------------- Init ---------------- */
(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
